# Credential for the GitHub "Publish Website" workflows (mojolicious.org and
# mojojs.org). It may only restart the two site deployments. The token in the
# Secret does not expire; delete the Secret to revoke it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deployer
  namespace: mojolicious
---
apiVersion: v1
kind: Secret
metadata:
  name: github-deployer-token
  namespace: mojolicious
  annotations:
    kubernetes.io/service-account.name: github-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-deployer
  namespace: mojolicious
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["mojolicious-org", "mojojs-org"]
    # patch for `rollout restart`; get/list/watch for `rollout status`
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deployer
  namespace: mojolicious
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-deployer
subjects:
  - kind: ServiceAccount
    name: github-deployer
    namespace: mojolicious
